const DB_NAME='MeuSemestreLocal',DB_VERSION=1,STATE_ID='main',STORE='state',FILE_STORE='files',LOCAL_KEY='meuSemestre2_local';
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const uid=()=>`${Date.now().toString(36)}-${Math.random().toString(36).slice(2,9)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>s?new Date(`${s}T12:00:00`).toLocaleDateString('pt-BR'):'—';
const isoMonth=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const monthName=d=>d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
const dayNames=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const initial=()=>({version:2,profile:{name:'',institution:'',course:'',modality:'',campus:'',shift:'',period:'',startDate:'',expectedEnd:'',photo:''},settings:{theme:'light',minGrade:'',attendanceLimit:'',dateFormat:'dd/mm/yyyy',timeFormat:'24h'},semesters:[],activeSemesterId:null,subjects:[],schedules:[],tasks:[],grades:[],attendance:[],events:[],materials:[],dashboard:{}});
let state=initial(),db=null,currentPage='dashboard',searchTerm='',calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1),calendarSelected=todayISO(),activeFilter='all',scheduleView='week',saveQueue=Promise.resolve(),localStorageWorks=false,persistentGranted=null;
function openDB(){return new Promise(resolve=>{if(!('indexedDB'in window)){resolve(null);return}let req;try{req=indexedDB.open(DB_NAME,DB_VERSION)}catch(e){resolve(null);return}req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(FILE_STORE))d.createObjectStore(FILE_STORE,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null);req.onblocked=()=>resolve(null)})}
function dbGet(store,id){return new Promise(resolve=>{if(!db){resolve(null);return}try{const r=db.transaction(store,'readonly').objectStore(store).get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)}catch(e){resolve(null)}})}
function dbPut(store,obj){return new Promise((resolve,reject)=>{if(!db){reject(new Error('IndexedDB indisponível'));return}try{const tx=db.transaction(store,'readwrite');tx.objectStore(store).put(obj);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Falha ao salvar'));tx.onabort=()=>reject(tx.error||new Error('Gravação cancelada'))}catch(e){reject(e)}})}
function dbDelete(store,id){return new Promise(resolve=>{if(!db){resolve();return}try{const tx=db.transaction(store,'readwrite');tx.objectStore(store).delete(id);tx.oncomplete=resolve;tx.onerror=resolve}catch(e){resolve()}})}
function readLocalSnapshot(){try{const raw=localStorage.getItem(LOCAL_KEY);localStorageWorks=true;if(!raw)return null;const parsed=JSON.parse(raw);if(parsed&&parsed.data&&typeof parsed.data==='object')return {data:parsed.data,updatedAt:parsed.updatedAt||''};return {data:parsed,updatedAt:''}}catch(e){return null}}
function writeLocalSnapshot(snapshot,updatedAt=new Date().toISOString()){try{localStorage.setItem(LOCAL_KEY,JSON.stringify({data:snapshot,updatedAt}));localStorageWorks=true;return true}catch(e){localStorageWorks=false;return false}}
async function load(){
 db=await openDB();
 const fromDB=await dbGet(STORE,STATE_ID),fromLocal=readLocalSnapshot();
 const dbStamp=Date.parse(fromDB?.updatedAt||'')||0,localStamp=Date.parse(fromLocal?.updatedAt||'')||0;
 let saved=null;
 if(fromDB&&fromLocal){
  // Prefer the newest valid timestamp. A local snapshot with a timestamp must
  // not be discarded just because an older IndexedDB record lacks metadata.
  saved=localStamp>dbStamp?fromLocal:fromDB;
 }else saved=fromDB||fromLocal;
 if(saved?.data){
  state={...initial(),...saved.data,profile:{...initial().profile,...saved.data.profile},settings:{...initial().settings,...saved.data.settings}};
  const repairedStamp=saved.updatedAt||new Date().toISOString();
  // Reconcile both stores so a stale copy cannot overwrite the restored data
  // on the next launch.
  if(db&&saved===fromLocal){try{await dbPut(STORE,{id:STATE_ID,data:saved.data,updatedAt:repairedStamp})}catch(e){}}
  if(saved===fromDB&&saved.data){writeLocalSnapshot(saved.data,repairedStamp)}
 }
 try{if(navigator.storage&&navigator.storage.persist)persistentGranted=await navigator.storage.persist()}catch(e){persistentGranted=false}
 applyTheme();render();updateSidebar();
 if(db&&localStorageWorks)setStorageStatus(persistentGranted?'Salvamento ativo · IndexedDB + cópia local protegida':'Salvamento ativo · IndexedDB + cópia local');
 else if(db)setStorageStatus('Salvamento ativo · IndexedDB do navegador');
 else if(localStorageWorks)setStorageStatus('Salvamento ativo · armazenamento local do navegador');
 else setStorageStatus('ATENÇÃO: este modo de abertura não confirmou armazenamento. Exporte um backup.');
}
async function save(){
 const snapshot=JSON.parse(JSON.stringify(state)),stamp=new Date().toISOString();
 const localOK=writeLocalSnapshot(snapshot,stamp);
 if(db){
  setStorageStatus('Salvando…');
  try{
   saveQueue=saveQueue.catch(()=>{}).then(()=>dbPut(STORE,{id:STATE_ID,data:snapshot,updatedAt:stamp}));
   await saveQueue;
   setStorageStatus(localOK?'Salvo · IndexedDB + cópia local':'Salvo · IndexedDB do navegador');
   return true;
  }catch(e){
   setStorageStatus(localOK?'Salvo apenas no armazenamento local':'ERRO: não foi possível salvar');
   if(!localOK)toast('Falha ao salvar. Exporte um backup imediatamente.');
   return localOK;
  }
 }
 if(localOK){setStorageStatus('Salvo no armazenamento local do navegador');return true;}
 setStorageStatus('ERRO: armazenamento indisponível');
 toast('Não foi possível salvar neste modo de abertura. Exporte um backup e use uma origem HTTPS estável.');
 return false;
}
function saveBeforeLeaving(){try{const snapshot=JSON.parse(JSON.stringify(state));writeLocalSnapshot(snapshot,new Date().toISOString())}catch(e){}}
function setStorageStatus(msg){const el=$('#storageStatus');if(el)el.textContent=msg}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2700)}
function activeSemester(){return state.semesters.find(s=>s.id===state.activeSemesterId)||null}
function semesterItems(arr){const sid=state.activeSemesterId;return sid?arr.filter(x=>x.semesterId===sid):arr}
function subjectName(id){return state.subjects.find(s=>s.id===id)?.name||'Sem disciplina vinculada'}
function activeSubjects(){return semesterItems(state.subjects)}
function scoped(arr){return state.activeSemesterId?arr.filter(x=>x.semesterId===state.activeSemesterId):arr}
function fmtNum(n,dec=1){return Number.isFinite(n)?n.toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec}):'—'}
function weightedAverage(subjectId){const gs=state.grades.filter(g=>g.subjectId===subjectId&&Number.isFinite(+g.score)&&+g.max>0&&+g.weight>0);if(!gs.length)return null;const total=gs.reduce((a,g)=>a+(+g.score/+g.max*10)*(+g.weight),0),w=gs.reduce((a,g)=>a+(+g.weight),0);return total/w}
function averageLabel(id){const n=weightedAverage(id);return n===null?'—':fmtNum(n,2)}
function getSelectSubjects(selected=''){const list=activeSubjects();return `<option value="">Sem disciplina</option>`+list.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('')}
function pageTitle(p){return ({dashboard:'Visão geral',semesters:'Semestres',subjects:'Disciplinas',schedule:'Horários',tasks:'Atividades',calendar:'Calendário',grades:'Notas e avaliações',attendance:'Frequência',materials:'Materiais',reports:'Relatórios',settings:'Configurações'})[p]||'Meu Semestre'}
const plusIcon='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',editIcon='<svg viewBox="0 0 24 24"><path d="m15 5 4 4M4 20l4-.8L19.2 8a2.1 2.1 0 0 0-3-3L5 16.2 4 20Z"/></svg>',deleteIcon='<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>',checkIcon='<svg viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></svg>';
function actionButtons(type,id){return `<div class="actions"><button class="action" data-action="edit" data-type="${type}" data-id="${id}" aria-label="Editar">${editIcon}</button><button class="action danger" data-action="delete" data-type="${type}" data-id="${id}" aria-label="Excluir">${deleteIcon}</button></div>`}
function empty(title,desc,btnLabel,action){return `<div class="empty"><div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div><strong>${esc(title)}</strong><p>${esc(desc)}</p>${btnLabel?`<button class="btn btn-primary btn-small" data-action="${action||'add'}">${plusIcon}${esc(btnLabel)}</button>`:''}</div>`}
function head(title,desc,buttonText='',action='',extra=''){return `<div class="page-head"><div><div class="eyebrow">Meu Semestre 2.0</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${extra}${buttonText?`<button class="btn btn-primary" data-action="${action}">${plusIcon}${buttonText}</button>`:''}</div></div>`}
function metric(label,value,foot,kind=''){return `<div class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon ${kind}">${kind==='green'?checkIcon:kind==='amber'?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>':'<svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h17M8 16v-5M13 16V7M18 16V9"/></svg>'}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></div>`}
function subjectOptions(){return getSelectSubjects()}
function dashboard(){const sid=state.activeSemesterId,subjects=activeSubjects(),tasks=scoped(state.tasks),grades=scoped(state.grades),events=scoped(state.events),sched=scoped(state.schedules);const pending=tasks.filter(t=>t.status!=='done'),upcoming=events.filter(e=>e.date>=todayISO()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,4),graded=subjects.map(s=>weightedAverage(s.id)).filter(x=>x!==null),avg=graded.length?graded.reduce((a,b)=>a+b,0)/graded.length:null,done=tasks.filter(t=>t.status==='done').length;
 const nextTasks=pending.filter(t=>!t.due||t.due>=todayISO()).sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).slice(0,4);
 let profile=state.profile, greeting=profile.name?`Olá, ${esc(profile.name.split(' ')[0])}!`:'Bem-vindo ao Meu Semestre!';
 return `${head(greeting,'Seu espaço acadêmico começa com as informações que você cadastrar.', 'Personalizar perfil','profile')}
 <div class="notice">Esta plataforma está vazia por padrão. Cadastre seu semestre e suas informações reais para começar. Seus dados são salvos neste dispositivo.</div>
 <div class="metrics">${metric('Disciplinas',subjects.length,subjects.length?'No semestre selecionado':'Nenhuma cadastrada')}${metric('Atividades pendentes',pending.length,pending.length?'Acompanhe seus prazos':'Nenhuma pendência', 'amber')}${metric('Média das disciplinas',avg===null?'—':fmtNum(avg,2),avg===null?'Adicione avaliações para calcular':'Média das disciplinas com notas')}${metric('Tarefas concluídas',tasks.length?`${Math.round(done/tasks.length*100)}%`:'—',tasks.length?`${done} de ${tasks.length} atividades`:'Sem atividades registradas','green')}</div>
 <div class="grid dash-grid"><div><div class="panel"><div class="panel-head"><div><div class="panel-title">Próximos compromissos</div><div class="panel-sub">Eventos cadastrados no semestre atual</div></div><button class="btn btn-secondary btn-small" data-nav="calendar">Ver calendário</button></div>${upcoming.length?`<div class="list">${upcoming.map(e=>`<div class="list-row"><span class="dot"></span><div class="row-main"><strong>${esc(e.title)}</strong><small>${fmtDate(e.date)}${e.time?' · '+esc(e.time):''} · ${esc(subjectName(e.subjectId))}</small></div><span class="pill">${esc(e.type||'Evento')}</span></div>`).join('')}</div>`:empty('Nenhum compromisso por enquanto','Quando você cadastrar provas, entregas e eventos, eles aparecerão aqui.','Adicionar evento','add-event')}</div>
 <div class="panel"><div class="panel-head"><div><div class="panel-title">Atividades</div><div class="panel-sub">Acompanhe o que precisa ser feito</div></div><button class="btn btn-secondary btn-small" data-nav="tasks">Ver todas</button></div>${nextTasks.length?`<div class="list">${nextTasks.map(t=>`<div class="list-row"><button class="action" data-action="toggle-task" data-id="${t.id}" title="Concluir">${checkIcon}</button><div class="row-main"><strong>${esc(t.title)}</strong><small>${esc(subjectName(t.subjectId))}</small></div><span class="row-meta">${t.due?fmtDate(t.due):'Sem prazo'}</span></div>`).join('')}</div>`:empty('Sua lista está livre','Cadastre uma atividade para organizar seus estudos.','Criar atividade','add-task')}</div>
 <div class="panel"><div class="panel-head"><div><div class="panel-title">Desempenho por disciplina</div><div class="panel-sub">Médias calculadas com as avaliações cadastradas</div></div><button class="btn btn-secondary btn-small" data-nav="grades">Ver notas</button></div>${subjects.some(s=>weightedAverage(s.id)!==null)?`<div class="bar-chart">${subjects.filter(s=>weightedAverage(s.id)!==null).map(s=>{let v=weightedAverage(s.id);return `<div class="bar-col"><b>${fmtNum(v,1)}</b><div class="bar-fill" style="height:${Math.max(2,v*10)}%"></div><small title="${esc(s.name)}">${esc(s.name.slice(0,9))}</small></div>`}).join('')}</div>`:empty('Sem notas para exibir','O gráfico será preenchido conforme você cadastrar avaliações.')}</div>
 <div class="panel"><div class="panel-head"><div><div class="panel-title">Seu contexto acadêmico</div><div class="panel-sub">Informações do perfil</div></div><button class="btn btn-secondary btn-small" data-action="profile">Editar perfil</button></div><div class="list">${[['Instituição',profile.institution],['Curso',profile.course],['Período',profile.period],['Turno',profile.shift]].map(([k,v])=>`<div class="list-row"><div class="row-main"><small>${k}</small><strong>${v?esc(v):'Não informado'}</strong></div></div>`).join('')}</div></div></div>
 <div><div class="panel"><div class="panel-head"><div><div class="panel-title">Resumo do semestre</div><div class="panel-sub">Dados do período selecionado</div></div></div>${sid?`<div class="list">${[['Semestre',activeSemester()?.name],['Início',fmtDate(activeSemester()?.startDate)],['Término',fmtDate(activeSemester()?.endDate)],['Horários cadastrados',sched.length],['Eventos cadastrados',events.length]].map(([k,v])=>`<div class="list-row"><div class="row-main"><small>${k}</small><strong>${esc(v??'—')}</strong></div></div>`).join('')}</div>`:empty('Nenhum semestre selecionado','Crie seu primeiro semestre para separar disciplinas, notas e atividades.','Criar semestre','add-semester')}</div>
 <div class="panel"><div class="panel-head"><div><div class="panel-title">Acesso rápido</div><div class="panel-sub">Organize sua rotina acadêmica</div></div></div><div class="grid" style="grid-template-columns:1fr 1fr;gap:8px"><button class="btn btn-secondary" data-action="add-subject">${plusIcon}Disciplina</button><button class="btn btn-secondary" data-action="add-task">${plusIcon}Atividade</button><button class="btn btn-secondary" data-action="add-grade">${plusIcon}Nota</button><button class="btn btn-secondary" data-action="add-event">${plusIcon}Evento</button></div></div>
 <div class="panel"><div class="panel-head"><div><div class="panel-title">Armazenamento</div><div class="panel-sub">Seus dados ficam neste navegador</div></div></div><div class="status-line"><span class="dot" style="background:var(--green)"></span><span id="storageStatus">Verificando armazenamento…</span></div><p class="panel-sub" style="line-height:1.6;margin-top:10px">Faça backups regulares em Configurações para proteger seus dados ou transferi-los para outro dispositivo.</p><button class="btn btn-secondary btn-small" data-nav="settings">Abrir configurações e backup</button></div></div></div>`}
function semestersPage(){let rows=state.semesters;return `${head('Semestres','Organize sua graduação por períodos letivos.','Novo semestre','add-semester')}${rows.length?`<div class="grid cards">${rows.map(s=>`<div class="card subject-card"><div class="subject-top"><div><div class="subject-name">${esc(s.name)}</div><div class="subject-code">${fmtDate(s.startDate)} — ${fmtDate(s.endDate)}</div></div><span class="pill ${s.id===state.activeSemesterId?'green':'gray'}">${s.id===state.activeSemesterId?'Atual':s.archived?'Arquivado':'Inativo'}</span></div><div class="subject-meta"><div><small>Disciplinas</small><strong>${state.subjects.filter(x=>x.semesterId===s.id).length}</strong></div><div><small>Atividades</small><strong>${state.tasks.filter(x=>x.semesterId===s.id).length}</strong></div></div><div class="head-actions" style="margin-top:13px"><button class="btn btn-primary btn-small" data-action="activate-semester" data-id="${s.id}">${s.id===state.activeSemesterId?'Selecionado':'Selecionar'}</button><button class="btn btn-secondary btn-small" data-action="edit" data-type="semester" data-id="${s.id}">Editar</button>${actionButtons('semester',s.id)}</div></div>`).join('')}</div>`:empty('Nenhum semestre cadastrado','Crie o período letivo atual. Cada semestre manterá suas próprias disciplinas, tarefas, avaliações e materiais.','Criar primeiro semestre','add-semester')}`}
function subjectsPage(){let arr=activeSubjects().filter(s=>matches([s.name,s.code,s.professor,s.description]));return `${head('Disciplinas','Cadastre e acompanhe as matérias de cada semestre.','Nova disciplina','add-subject')}${!state.activeSemesterId?`<div class="notice">Selecione ou crie um semestre para cadastrar disciplinas.</div>`:''}${arr.length?`<div class="grid cards">${arr.map(s=>`<div class="card subject-card"><div class="subject-top"><div><div class="subject-name">${esc(s.name)}</div><div class="subject-code">${esc(s.code||'Sem código')} · ${esc(s.professor||'Professor não informado')}</div></div><span class="pill">${esc(s.status||'Em andamento')}</span></div><div class="subject-meta"><div><small>Carga horária</small><strong>${s.hours?esc(s.hours)+' h':'—'}</strong></div><div><small>Créditos</small><strong>${s.credits||'—'}</strong></div><div><small>Média atual</small><strong>${averageLabel(s.id)}</strong></div><div><small>Frequência</small><strong>${attendanceRate(s.id)===null?'—':fmtNum(attendanceRate(s.id),1)+'%'}</strong></div></div><div class="head-actions" style="margin-top:13px"><button class="btn btn-secondary btn-small" data-action="subject-detail" data-id="${s.id}">Ver detalhes</button>${actionButtons('subject',s.id)}</div></div>`).join('')}</div>`:empty('Nenhuma disciplina cadastrada','Adicione as matérias do semestre selecionado.','Adicionar disciplina','add-subject')}`}
function subjectDetail(id){const s=state.subjects.find(x=>x.id===id);if(!s)return;const tasks=state.tasks.filter(x=>x.subjectId===id),grades=state.grades.filter(x=>x.subjectId===id),mats=state.materials.filter(x=>x.subjectId===id),sch=state.schedules.filter(x=>x.subjectId===id),att=state.attendance.filter(x=>x.subjectId===id);$('#content').innerHTML=`${head(esc(s.name),`Detalhes da disciplina · ${esc(s.code||'Sem código')}`, '', '', `<button class="btn btn-secondary" data-nav="subjects">Voltar</button><button class="btn btn-primary" data-action="edit" data-type="subject" data-id="${id}">Editar disciplina</button>`)}<div class="grid dash-grid"><div><div class="panel"><div class="panel-head"><div class="panel-title">Informações gerais</div>${actionButtons('subject',id)}</div><div class="grade-summary"><div class="grade-box"><small>Professor</small><strong style="font-size:13px">${esc(s.professor||'—')}</strong></div><div class="grade-box"><small>Carga horária</small><strong>${s.hours?esc(s.hours)+'h':'—'}</strong></div><div class="grade-box"><small>Créditos</small><strong>${s.credits||'—'}</strong></div></div><p style="font-size:11px;color:var(--muted)">${esc(s.description||'Sem descrição cadastrada.')}</p></div><div class="panel"><div class="panel-head"><div class="panel-title">Avaliações e notas</div><button class="btn btn-primary btn-small" data-action="add-grade" data-subject="${id}">${plusIcon}Nova nota</button></div>${grades.length?`<div class="list">${grades.map(g=>`<div class="list-row"><div class="row-main"><strong>${esc(g.title)}</strong><small>${fmtDate(g.date)} · Peso ${g.weight||1}</small></div><b>${g.score}/${g.max}</b>${actionButtons('grade',g.id)}</div>`).join('')}</div>`:empty('Sem avaliações','As notas desta disciplina aparecerão aqui.','Adicionar avaliação','add-grade')}</div><div class="panel"><div class="panel-head"><div class="panel-title">Atividades</div><button class="btn btn-secondary btn-small" data-action="add-task" data-subject="${id}">Adic function getEntity(type,id){const map={semester:'semesters',subject:'subjects',schedule:'schedules',task:'tasks',grade:'grades',attendance:'attendance',event:'events',material:'materials'};return type==='profile'?state.profile:state[map[type]]?.find(x=>x.id===id)||{}}
function currentSemesterId(){return state.activeSemesterId||''}
async function handleEntitySubmit(e){e.preventDefault();const form=e.target,fd=new FormData(form),modalTitle=$('#modalTitle').textContent;const type=modalTitle.includes('perfil')?'profile':modalTitle.includes('semestre')?'semester':modalTitle.includes('disciplina')?'subject':modalTitle.includes('horário')?'schedule':modalTitle.includes('atividade')?'task':modalTitle.includes('avaliação')?'grade':modalTitle.includes('frequência')?'attendance':modalTitle.includes('evento')?'event':'material';let editId=form.dataset.id||null;const v=Object.fromEntries(fd.entries());if(type==='profile'){const photo=fd.get('photoFile');delete v.photoFile;if(photo&&photo.size){if(photo.size>2*1024*1024){toast('A foto deve ter no máximo 2 MB.');return}if(!photo.type.startsWith('image/')){toast('Selecione um arquivo de imagem.');return}v.photo=await blobToDataURL(photo)}state.profile={...state.profile,...v};const ok=await save();closeModal();render();toast(ok?'Perfil salvo neste navegador.':'Não foi possível confirmar o salvamento. Exporte um backup antes de sair.');return}
 if(type==='semester'){v.archived=v.archived==='true';if(v.startDate&&v.endDate&&v.endDate<v.startDate){toast('A data final do semestre precisa ser posterior à inicial.');return}let obj={...v,id:editId||uid()};if(editId)state.semesters=state.semesters.map(x=>x.id===editId?obj:x);else{state.semesters.push(obj);if(!state.activeSemesterId)state.activeSemesterId=obj.id} }
 else {let arrKey={subject:'subjects',schedule:'schedules',task:'tasks',grade:'grades',attendance:'attendance',event:'events',material:'materials'}[type];if(type==='subject'||type==='schedule'||type==='task'||type==='grade'||type==='attendance'||type==='event'||type==='material'){v.semesterId=(editId?getEntity(type,editId).semesterId:null)||currentSemesterId()}
 if(type==='material'&&v.url){try{const u=new URL(v.url);if(!['http:','https:'].includes(u.protocol)){toast('O link precisa utilizar HTTP ou HTTPS.');return}}catch(e){toast('Informe um link válido.');return}}
 if(type==='schedule'){if(v.start>=v.end){toast('O horário final precisa ser posterior ao início.');return}v.day=+v.day;const collision=state.schedules.some(x=>x.id!==editId&&x.semesterId===v.semesterId&&+x.day===v.day&&v.start<x.end&&v.end>x.start);if(collision&&!confirm('Este horário coincide com outro horário cadastrado. Deseja salvar mesmo assim?'))return}

 if(type==='attendance'){v.lessons=+v.lessons}
 if(type==='material'){const f=fd.get('file');if(f&&f.size){const fileId=uid();try{if(db){await dbPut(FILE_STORE,{id:fileId,blob:f,name:f.name,type:f.type,size:f.size});v.fileId=fileId}else{v.fileData=await blobToDataURL(f);v.fileId=fileId}v.fileName=f.name;v.fileType=f.type;v.fileSize=f.size}catch(err){toast('Não foi possível salvar o arquivo. Tente um arquivo menor ou use o link externo.');return}}else if(editId){const old=getEntity(type,editId);v.fileId=old.fileId;v.fileName=old.fileName;v.fileType=old.fileType;v.fileSize=old.fileSize;v.fileData=old.fileData}}
 let obj={...v,id:editId||uid()};if(editId){state[arrKey]=state[arrKey].map(x=>x.id===editId?obj:x)}else if(type==='event'&&v.repeat&&v.repeat!=='none'){const base=new Date(v.date+'T12:00:00');for(let i=0;i<4;i++){let d=new Date(base);if(v.repeat==='weekly')d.setDate(d.getDate()+7*i);else d.setMonth(d.getMonth()+i);state.events.push({...obj,id:uid(),date:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,repeatSeries:obj.id})}}else state[arrKey].push(obj);
 }
 save();closeModal();render();toast('Informações salvas.');}
async function removeEntity(type,id){if(!confirm('Tem certeza de que deseja excluir este registro?'))return;const map={semester:'semesters',subject:'subjects',schedule:'schedules',task:'tasks',grade:'grades',attendance:'attendance',event:'events',material:'materials'};if(type==='semester'){if(state.activeSemesterId===id)state.activeSemesterId=null;state.semesters=state.semesters.filter(x=>x.id!==id);['subjects','schedules','tasks','grades','attendance','events','materials'].forEach(k=>state[k]=state[k].filter(x=>x.semesterId!==id))}else{if(type==='material'){let m=getEntity(type,id);if(m.fileId)await dbDelete(FILE_STORE,m.fileId)}if(type==='subject'){for(const m of state.materials.filter(x=>x.subjectId===id)){if(m.fileId)await dbDelete(FILE_STORE,m.fileId)}for(const k of ['schedules','tasks','grades','attendance','events','materials'])state[k]=state[k].filter(x=>x.subjectId!==id)}state[map[type]]=state[map[type]].filter(x=>x.id!==id)}save();render();toast('Registro excluído.')}
function add(type,extra={}){openEntity(type,null,extra)}
function dataURLToBlob(dataURL){let [meta,b64]=dataURL.split(',');let mime=(meta.match(/:(.*?);/)||[])[1]||'application/octet-stream';let bin=atob(b64),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return new Blob([arr],{type:mime})}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
function download(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function backup(){const payload={app:'Meu Semestre',formatVersion:2,createdAt:new Date().toISOString(),state,files:[]};if(db){for(const m of state.materials.filter(x=>x.fileId)){const f=await dbGet(FILE_STORE,m.fileId);if(f?.blob)payload.files.push({id:f.id,name:f.name,type:f.type,size:f.size,data:await blobToDataURL(f.blob)})}}download(new Blob([JSON.stringify(payload)],{type:'application/json'}),`meu-semestre-backup-${todayISO()}.json`);toast('Backup exportado. Guarde o arquivo em local seguro.')}
async function verifySnapshot(expected){
 const target=JSON.stringify(expected);
 let localMatch=false,dbMatch=false;
 try{const local=readLocalSnapshot();localMatch=!!local&&JSON.stringify(local.data)===target}catch(e){}
 try{const rec=await dbGet(STORE,STATE_ID);dbMatch=!!rec?.data&&JSON.stringify(rec.data)===target}catch(e){}
 return {ok:localMatch||dbMatch,localMatch,dbMatch};
}
async function restore(file){
 try{
  const payload=JSON.parse(await file.text());
  if(payload.app!=='Meu Semestre'||!payload.state||!Array.isArray(payload.state.semesters)||!Array.isArray(payload.state.subjects))throw new Error('Formato de backup inválido');
  if(!confirm('Restaurar este backup substituirá os dados atuais desta instalação. Faça um backup atual antes de continuar. Deseja prosseguir?'))return;
  const base=initial();
  const imported={...base,...payload.state,profile:{...base.profile,...payload.state.profile},settings:{...base.settings,...payload.state.settings}};
  if(db){for(const f of payload.files||[]){if(f?.id&&f?.data)await dbPut(FILE_STORE,{id:f.id,blob:dataURLToBlob(f.data),name:f.name||'arquivo',type:f.type||'application/octet-stream',size:f.size||0})}}
  state=imported;
  const persisted=await save();
  const verification=await verifySnapshot(imported);
  render();
  if(persisted&&verification.ok)toast('Backup restaurado e verificado no armazenamento deste navegador.');
  else toast('Os dados foram carregados na tela, mas a gravação não foi confirmada. Não atualize; exporte o backup e tente novamente.');
 }catch(e){toast('Não foi possível restaurar: '+e.message)}
}
function exportCSV(){const rows=[['Tipo','Nome','Disciplina','Data','Detalhe']];state.subjects.filter(s=>!state.activeSemesterId||s.semesterId===state.activeSemesterId).forEach(s=>rows.push(['Disciplina',s.name,'', '',s.code||'']));scoped(state.tasks).forEach(t=>rows.push(['Atividade',t.title,subjectName(t.subjectId),t.due||'',t.status]));scoped(state.grades).forEach(g=>rows.push(['Avaliação',g.title,subjectName(g.subjectId),g.date||'',`${g.score}/${g.max} (peso ${g.weight})`]));scoped(state.events).forEach(e=>rows.push(['Evento',e.title,subjectName(e.subjectId),e.date||'',e.time||'']));const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),`meu-semestre-relatorio-${todayISO()}.csv`);toast('CSV exportado.')}
function printReport(){let w=window.open('','_blank');if(!w){toast('Permita pop-ups para gerar o relatório.');return}let subs=activeSubjects();w.document.write(`<html><head><title>Relatório Meu Semestre</title><style>body{font:14px Arial;padding:30px;color:#182743}h1{color:#2457d6}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{border:1px solid #ddd;padding:9px;text-align:left}th{background:#edf3ff}</style></head><body><h1>Meu Semestre — Relatório acadêmico</h1><p>Gerado em ${new Date().toLocaleString('pt-BR')}</p><h2>Disciplinas</h2><table><tr><th>Disciplina</th><th>Média</th><th>Frequência</th></tr>${subs.map(s=>`<tr><td>${esc(s.name)}</td><td>${averageLabel(s.id)}</td><td>${attendanceRate(s.id)===null?'—':fmtNum(attendanceRate(s.id),1)+'%'}</td></tr>`).join('')}</table><h2>Atividades</h2><p>${scoped(state.tasks).length} atividades cadastradas; ${scoped(state.tasks).filter(t=>t.status==='done').length} concluídas.</p></body></html>`);w.document.close();w.focus();w.print()}
async function downloadMaterial(id){const m=getEntity('material',id);if(!m?.fileId)return;if(m.fileData){download(dataURLToBlob(m.fileData),m.fileName||'material');return}const f=await dbGet(FILE_STORE,m.fileId);if(!f?.blob){toast('Arquivo não encontrado neste navegador. Tente restaurar um backup que contenha o anexo.');return}download(f.blob,f.name||m.fileName||'material')}
function handleAction(b){const a=b.dataset.action,id=b.dataset.id,type=b.dataset.type;switch(a){case 'add':add('subject');break;case 'add-semester':add('semester');break;case 'add-subject':add('subject');break;case 'add-schedule':add('schedule',{subject:b.dataset.subject});break;case 'add-task':add('task',{subject:b.dataset.subject});break;case 'add-grade':add('grade',{subject:b.dataset.subject});break;case 'add-attendance':add('attendance',{subject:b.dataset.subject});break;case 'add-event':add('event',{date:b.dataset.date});break;case 'add-material':add('material',{subject:b.dataset.subject});break;case 'profile':openEntity('profile');break;case 'edit':if(type==='semester'||type==='subject'||type==='schedule'||type==='task'||type==='grade'||type==='attendance'||type==='event'||type==='material')openEntity(type,id);break;case 'edit-subject':openEntity('subject',b.dataset.id||'');break;case 'delete':removeEntity(type,id);break;case 'close-modal':closeModal();break;case 'activate-semester':state.activeSemesterId=id;save();render();toast('Semestre selecionado.');break;case 'toggle-task':{let t=state.tasks.find(x=>x.id===id);if(t)t.status=t.status==='done'?'pending':'done';save();render();break}case 'subject-detail':subjectDetail(id);break;case 'schedule-view':scheduleView=b.dataset.view;render();break;case 'select-date':calendarSelected=b.dataset.date;render();break;case 'month-prev':calendarCursor.setMonth(calendarCursor.getMonth()-1);render();break;case 'month-next':calendarCursor.setMonth(calendarCursor.getMonth()+1);render();break;case 'month-today':calendarCursor=new Date(new Date().getFullYear(),new Date().getMonth(),1);calendarSelected=todayISO();render();break;case 'backup':backup();break;case 'restore':$('#restoreFile').click();break;case 'export-csv':exportCSV();break;case 'print-report':printReport();break;case 'download-material':downloadMaterial(id);break;case 'save-settings':saveSettings();break;case 'calc-required':calculateRequired();break;case 'clear-data':if(confirm('Apagar TODOS os dados desta plataforma? Esta ação não pode ser desfeita sem backup.')){state=initial();if(db){let tx=db.transaction([STORE,FILE_STORE],'readwrite');tx.objectStore(STORE).clear();tx.objectStore(FILE_STORE).clear()}else localStorage.removeItem('meuSemestre2_local');save();navigate('dashboard');toast('Dados apagados.')}break;case 'storage-info':toast(!db&&!localStorageWorks?'Este modo de abertura não permite confirmar salvamento. Use uma versão hospedada em HTTPS e faça backup.':`Armazenamento detectado: ${db?'IndexedDB ':''}${localStorageWorks?'cópia local':''}. Faça backups regulares.`);break}}
function calculateRequired(){const id=$('#calcSubject')?.value,target=Number($('#calcTarget')?.value),weight=Number($('#calcWeight')?.value),out=$('#requiredResult');if(!id||!Number.isFinite(target)||target<0||target>10||!Number.isFinite(weight)||weight<=0){toast('Informe disciplina, média entre 0 e 10 e peso maior que zero.');return}const gs=state.grades.filter(g=>g.subjectId===id&&+g.max>0&&+g.weight>0&&Number.isFinite(+g.score)),sum=gs.reduce((a,g)=>a+(+g.score/+g.max*10)*(+g.weight),0),oldWeight=gs.reduce((a,g)=>a+(+g.weight),0),needed=(target*(oldWeight+weight)-sum)/weight;out.innerHTML=needed>10?`<span class="pill red">Nota acima de 10</span> Mesmo tirando 10, a média desejada não será alcançada com apenas essa avaliação e esse peso.`:needed<=0?`<span class="pill green">Meta alcançada</span> Você já atingiu a média desejada; uma nota 0 nesta avaliação ainda manteria a meta.`:`Você precisa obter aproximadamente <strong>${fmtNum(needed,2)} / 10</strong> na próxima avaliação para chegar à média ${fmtNum(target,2)}, considerando peso ${fmtNum(weight,2)}. A simulação considera todas as notas registradas nesta disciplina.`}function saveSettings(){const theme=$('#themeSelect')?.value,min=$('#minGrade')?.value,limit=$('#attendanceLimit')?.value,time=$('#timeFormat')?.value;if(min!==''&&(Number(min)<0||Number(min)>10)){toast('A média mínima deve ficar entre 0 e 10.');return}if(limit!==''&&(Number(limit)<0||Number(limit)>100)){toast('A frequência mínima deve ficar entre 0 e 100%.');return}state.settings={...state.settings,theme,minGrade:min,attendanceLimit:limit,timeFormat:time};applyTheme();save();render();toast('Preferências salvas.')}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});
$('#content').addEventListener('click',e=>{const n=e.target.closest('[data-nav]');if(n){navigate(n.dataset.nav);return}const b=e.target.closest('[data-action]');if(b)handleAction(b)});
$('#modalBody').addEventListener('submit',handleEntitySubmit);
$('#modalClose').addEventListener('click',closeModal);$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal()});
$('#content').addEventListener('change',e=>{if(e.target.id==='restoreFile'){const f=e.target.files?.[0];if(f)restore(f);e.target.value='';return}if(e.target.id==='taskFilter'){activeFilter=e.target.value;render();$('#taskFilter').value=activeFilter}if(e.target.id==='themeSelect'){state.settings.theme=e.target.value;applyTheme();save()} });
$('#content').addEventListener('click',e=>{if(e.target.closest('[data-action="edit-subject"]')){let btn=e.target.closest('[data-action="edit-subject"]');openEntity('subject',btn.dataset.id)}});
$('#globalSearch').addEventListener('input',e=>{searchTerm=e.target.value;if(['subjects','tasks','schedule','grades','attendance','materials'].includes(currentPage))render()});
$('#themeToggle').addEventListener('click',()=>{state.settings.theme=state.settings.theme==='dark'?'light':'dark';applyTheme();save();if(currentPage==='settings')render()});$('#quickAdd').addEventListener('click',()=>{if(currentPage==='subjects')add('subject');else if(currentPage==='schedule')add('schedule');else if(currentPage==='grades')add('grade');else if(currentPage==='calendar')add('event');else add('task')});
$('#menuToggle').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#overlay').classList.toggle('show')});$('#overlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')});
$('#content').addEventListener('change',e=>{if(e.target.id==='timeFormat'){state.settings.timeFormat=e.target.value;save()}});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
window.addEventListener('pagehide',saveBeforeLeaving);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveBeforeLeaving()});
(async()=>{await load();})();
})();
</script>
</body></html>
